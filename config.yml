load:
  type: constant
  stages:
  - rate: 20
    duration: 300
  - rate: 20
    duration: 600
api: 
  type: completion
  streaming: true
  timeout: 300.0
  headers:
    Host: team1.example.com
    Content-Type: "application/json"
server:
  type: vllm
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  base_url: http://10.64.3.22:80
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
data:
  type: chat
  chat:
    num_chats: 1024
    num_messages_per_chat: 127
    message_len: 256
    output_len: 256
metrics:
  type: prometheus
  prometheus:
    scrape_interval: 15
    google_managed: true
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
  prometheus:
    summary: true
    per_stage: false
