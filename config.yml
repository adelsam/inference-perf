load:
  type: constant
  stages:
  - rate: 20
    duration: 300
  - rate: 20
    duration: 600
api: 
  type: completion
  streaming: true
server:
  type: vllm
  model_name: meta-llama/Llama-3.1-8B-Instruct
  base_url: http://10.64.3.11:80
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
data:
  type: chat
  chat:
    num_chats: 1024
    num_messages_per_chat: 128
    message_len: 256
    output_len: 256
metrics:
  type: prometheus
  prometheus:
    scrape_interval: 15
    google_managed: true
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
  prometheus:
    summary: true
    per_stage: false
